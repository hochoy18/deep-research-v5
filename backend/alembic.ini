# Alembic configuration for the v5 backend.
#
# The connection string is supplied via env.py reading DATABASE_URL from the
# environment. Operators configure DATABASE_URL per ADR 0002 — no URLs in
# source.

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url =

# File template for new revisions.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Migrations are forward-only per the P1 spec. `alembic downgrade` is
# available for debugging only.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S